[build]
  command = "python3 scripts/publish-netlify.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/Jwellery.html"
  to = "/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/Jwellery.html*"
  to = "/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/jwellery"
  to = "/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/Jwellery"
  to = "/index.html"
  status = 301
  force = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/supabase-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/login-modal.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
