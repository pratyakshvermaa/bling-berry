<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Bling Berry</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=UnifrakturMaguntia&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f8f0f0;
            --cream-deep: #efe4e2;
            --paper: #fffaf9;
            --cherry: #902820;
            --cherry-deep: #721f19;
            --ink: #1a1212;
            --muted: #6b5553;
            --line: #e4d4d1;
            --gold-soft: #c4a484;
            --ease-silk: cubic-bezier(0.23, 0.12, 0.18, 1);
            --ease-inout: cubic-bezier(0.45, 0.05, 0.55, 0.95);
            font: 100%/1.55 "Outfit", system-ui, sans-serif;
            color: var(--ink);
            background: var(--cream);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        img { max-width: 100%; display: block; }
        a { color: inherit; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(900px 500px at 20% 10%, #f3d4d0 0%, transparent 55%),
                radial-gradient(700px 400px at 80% 90%, #f7e6e2 0%, transparent 50%),
                var(--cream);
            padding: 24px;
        }
        .auth-card {
            width: min(440px, 100%);
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: clamp(2rem, 5vw, 3rem);
            box-shadow: 0 24px 64px rgba(26, 18, 18, 0.08);
        }
        .auth-logo {
            display: block;
            width: 64px;
            height: auto;
            margin: 0 auto 24px;
        }
        .auth-card h1 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-align: center;
            margin-bottom: 6px;
        }
        .auth-card .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.88rem;
            margin-bottom: 28px;
        }
        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            font-size: 0.74rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font: inherit;
            font-size: 0.92rem;
            background: var(--cream);
            color: var(--ink);
            transition: border-color 0.4s var(--ease-inout), box-shadow 0.4s var(--ease-inout);
        }
        .field input:focus {
            outline: none;
            border-color: var(--gold-soft);
            box-shadow: 0 0 0 3px rgba(196, 164, 132, 0.18);
        }
        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 999px;
            background: var(--cherry);
            color: var(--cream);
            font: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.4s var(--ease-inout), transform 180ms var(--ease-silk);
        }
        .btn-primary:hover { background: var(--cherry-deep); }
        .btn-primary:active { transform: scale(0.985); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0;
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--paper);
            color: var(--ink);
            font: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: border-color 0.4s var(--ease-inout), background 0.4s var(--ease-inout), transform 180ms var(--ease-silk);
        }
        .btn-google:hover { border-color: var(--gold-soft); background: var(--cream); }
        .btn-google:active { transform: scale(0.985); }
        .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .auth-footer a {
            color: var(--cherry);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover { text-decoration: underline; }
        .error-msg {
            background: rgba(144, 40, 32, 0.08);
            color: var(--cherry);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.is-on { display: block; }
    </style>
</head>
<body>
    <div class="auth-card">
        <a href="index.html">
            <img class="auth-logo" src="assets/bling-berry-logo.png" alt="Bling Berry">
        </a>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your Bling Berry account</p>

        <div class="error-msg" id="error-msg"></div>

        <form id="login-form" autocomplete="on">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Your password">
            </div>
            <button class="btn-primary" type="submit" id="submit-btn">Sign in</button>
        </form>

        <div class="divider">or</div>

        <button class="btn-google" type="button" id="google-btn">
            <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
        </button>

        <p class="auth-footer">
            Don't have an account? <a href="signup.html">Sign up</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=live2"></script>
    <script>
        (function () {
            var form = document.getElementById("login-form");
            var errEl = document.getElementById("error-msg");
            var btn = document.getElementById("submit-btn");
            var googleBtn = document.getElementById("google-btn");
            var divider = document.querySelector(".divider");
            if (!bb.googleAuthEnabled || !bb.googleAuthEnabled() || !bb.authRedirectTo || !bb.authRedirectTo("/complete-profile.html")) {
                if (googleBtn) googleBtn.style.display = "none";
                if (divider) divider.style.display = "none";
            }

            function showError(msg) {
                errEl.textContent = msg;
                errEl.classList.add("is-on");
            }

            bb.getUser().then(function (user) {
                if (user) window.location.href = "index.html";
            });

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                errEl.classList.remove("is-on");
                btn.disabled = true;
                btn.textContent = "Signing in…";

                var email = document.getElementById("email").value.trim();
                var password = document.getElementById("password").value;

                var signIn = bb.signInWithFallback
                    ? bb.signInWithFallback(email, password)
                    : bb.supabase.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
                        if (res.error) return Promise.reject(res.error);
                    });
                signIn.then(function () {
                    window.location.href = "index.html";
                }).catch(function (err) {
                    showError(bb.friendlyAuthError ? bb.friendlyAuthError(err) : "Could not sign in.");
                    btn.disabled = false;
                    btn.textContent = "Sign in";
                });
            });

            document.getElementById("google-btn").addEventListener("click", function () {
                var redirectTo = bb.authRedirectTo ? bb.authRedirectTo("/complete-profile.html") : "";
                if (!redirectTo) {
                    showError("On this Wi-Fi, use email and password to sign in.");
                    return;
                }
                bb.supabase.auth.signInWithOAuth({
                    provider: "google",
                    options: { redirectTo: redirectTo }
                });
            });
        }());
    </script>
</body>
</html>
